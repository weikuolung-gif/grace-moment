<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福音探索樂園｜三環福音・四律・五色珠</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#293350}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 15%,#fff7d9,transparent 32%),radial-gradient(circle at 90% 20%,#e5d8ff,transparent 36%),linear-gradient(145deg,#d8f4fa,#f9eafa);overflow-x:hidden}header{padding:24px 16px;text-align:center}h1{font-size:clamp(28px,5vw,48px);margin:4px;color:#4e458e}header p{color:#666c89}main{max-width:1020px;margin:auto;padding:0 16px 48px}.tabs,.modes,.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.tabs button,.modes button,.actions button{border:0;border-radius:999px;padding:13px 20px;background:white;color:#4b4879;font-weight:750;cursor:pointer;box-shadow:0 5px 18px #5c5a9b20;font-size:15px}.tabs button.active,.modes button.active,.actions button.primary{background:#6653bd;color:white}.stage{margin:22px auto;min-height:460px;background:#ffffffd9;border:1px solid white;box-shadow:0 20px 60px #6b63a12c;border-radius:30px;padding:26px;position:relative;overflow:hidden}.scene{text-align:center;animation:appear .45s ease}.emoji{font-size:clamp(70px,15vw,130px);filter:drop-shadow(0 12px 12px #7466a330);animation:float 3s ease-in-out infinite}.scene h2{font-size:clamp(25px,4vw,38px);color:#53489a;margin:10px 0}.scene p{font-size:clamp(17px,2.5vw,22px);line-height:1.75;max-width:680px;margin:12px auto}.verse{display:inline-block;background:#f3efff;color:#6653a0;border-radius:15px;padding:10px 16px;margin:12px}.progress{text-align:center;margin:16px;color:#6b6688}.bar{height:8px;background:#ffffff90;border-radius:20px;overflow:hidden;margin:10px auto;max-width:460px}.fill{height:100%;background:linear-gradient(90deg,#71c5d9,#a28af1);transition:width .4s}.blackboard{background:#183c39;border:13px solid #b99469;color:white;border-radius:18px;padding:14px;min-height:400px}.blackboard svg{display:block;width:100%;max-width:800px;height:auto;margin:auto}.draw{fill:none;stroke:#f8f4db;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:sketch 1.15s ease forwards}.chalk{fill:#f8f4db;font-size:22px;font-weight:bold;opacity:0;animation:fade .7s .8s forwards}.beads{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:35px auto}.bead{width:clamp(43px,10vw,90px);height:clamp(43px,10vw,90px);border-radius:50%;border:5px solid #ffffff9e;box-shadow:inset -12px -12px 14px #0002,0 10px 20px #0002;opacity:.25;transform:scale(.85);transition:.5s}.bead.on{opacity:1;transform:scale(1)}.hint{text-align:center;color:#756e92;font-size:14px;margin-top:18px}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes sketch{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@media(max-width:600px){.stage{padding:15px;min-height:400px;border-radius:20px}.tabs button,.modes button,.actions button{padding:11px 13px;font-size:14px}.blackboard{border-width:7px;padding:5px}}
</style></head><body><header><div style="font-size:35px">🌈 ✨ 🕊️</div><h1>福音探索樂園</h1><p>一段關於愛、盼望與新生命的旅程</p></header><main><nav class="tabs"><button data-tool="circles" class="active">⭕ 三環福音</button><button data-tool="laws">📖 四個屬靈定律</button><button data-tool="beads">📿 五色珠</button></nav><div class="modes" id="modes" style="margin-top:17px"><button data-mode="cards" class="active">🃏 故事卡片</button><button data-mode="board">✏️ 繪製黑板</button></div><section class="stage" id="stage" aria-live="polite"></section><div class="bar"><div class="fill" id="fill"></div></div><div class="progress" id="progress"></div><div class="actions"><button id="prev">← 上一步</button><button class="primary" id="next">下一步 →</button><button id="reset">↺ 重新開始</button><button id="share">分享福音 ♡</button></div><p class="hint">適用手機、平板、電腦 · 不需安裝 · 按步驟探索</p></main><script>
const circles=[["🌍","神美好的設計","神創造我們，願我們活在愛、平安與祂的關係中。","創世記 1:31"],["💔","世界的破碎","人選擇偏離神的道路，罪使人與神隔絕，也帶來世界的破碎。","羅馬書 3:23"],["🧭","尋找出路","人試圖靠自己的努力修補破碎，但仍需要真正的拯救。","羅馬書 6:23"],["✝️","耶穌的福音","耶穌為我們的罪死在十字架上，第三天復活，帶來新的盼望。","哥林多前書 15:3–4"],["🙏","悔改並相信","神邀請我們回轉，信靠耶穌，領受祂所賜的新生命。","馬可福音 1:15"],["🌱","恢復與成長","跟隨耶穌，在愛中成長，也將這份盼望分享給別人。","哥林多後書 5:17"]];
const laws=[["❤️","第一律：神愛你","神愛你，並且為你的生命有美好的計畫。","約翰福音 3:16"],["💔","第二律：人有罪","人因罪與神隔絕，因此不能靠自己完全認識神的愛。","羅馬書 3:23"],["✝️","第三律：耶穌是道路","耶穌基督為人的罪死而復活，是神為人預備的救恩。","羅馬書 5:8"],["🙏","第四律：親自接受基督","我們需要藉著信心接受耶穌基督，開始與神建立關係。","約翰福音 1:12"],["🌷","你的回應","你願意進一步認識耶穌，並思考是否信靠祂嗎？可以用自己的話向神禱告。","啟示錄 3:20"]];
const beads=[["👑","金色：神的榮耀","金色提醒我們神的聖潔、美好與永恆的愛。","啟示錄 21:21"],["🖤","黑色：罪的問題","罪使人與神隔絕，我們都需要神的赦免。","羅馬書 3:23"],["❤️","紅色：耶穌寶血","耶穌為我們捨命，祂的救恩出於愛與恩典。","羅馬書 5:8"],["🤍","白色：潔淨更新","因著耶穌，我們可以蒙赦免，得到新的生命。","約翰一書 1:9"],["🌱","綠色：生命成長","信主之後，透過禱告、聖經、團契與服事持續成長。","彼得後書 3:18"]];
let tool="circles",mode="cards",step=0;const $=id=>document.getElementById(id);const data=()=>({circles,laws,beads})[tool];
function card(){let d=data()[step];return '<div class="scene"><div class="emoji">'+d[0]+'</div><h2>'+d[1]+'</h2><p>'+d[2]+'</p><div class="verse">📖 '+d[3]+'</div></div>'}
const shapes=[
'<circle class="draw" cx="160" cy="100" r="69"/><text class="chalk" x="160" y="96" text-anchor="middle">神的設計</text><text class="chalk" x="160" y="123" text-anchor="middle">♡</text>',
'<path class="draw" d="M232 110 Q305 125 343 181 M327 172 L343 181 L344 161"/>',
'<circle class="draw" cx="410" cy="258" r="70"/><text class="chalk" x="410" y="256" text-anchor="middle">破碎世界</text><text class="chalk" x="410" y="283" text-anchor="middle">💔</text>',
'<path class="draw" d="M348 296 Q290 350 229 317 M246 314 L229 317 L237 335"/>',
'<circle class="draw" cx="155" cy="268" r="70"/><text class="chalk" x="155" y="264" text-anchor="middle">耶穌福音</text><path class="draw" d="M155 278 v38 m-18 -25 h36"/>',
'<path class="draw" d="M85 215 Q48 162 86 111 M70 121 L86 111 L98 125"/>',
'<path class="draw" d="M346 216 Q299 189 229 241 M238 222 L229 241 L249 244"/>',
'<text class="chalk" x="292" y="165" text-anchor="middle" font-size="17">罪</text><text class="chalk" x="290" y="340" text-anchor="middle" font-size="17">悔改 · 相信</text>',
'<text class="chalk" x="290" y="380" text-anchor="middle" font-size="17">恢復 · 成長 · 分享</text>'];
function board(){return '<div class="blackboard"><svg viewBox="0 0 570 400" role="img" aria-label="三環福音逐筆繪製黑板">'+shapes.slice(0,step+1).map((s,i)=>'<g'+(i===step?'':' style="animation:none"')+'>'+s+'</g>').join('').replaceAll('class="draw"','class="draw"').replaceAll('class="chalk"','class="chalk"')+'</svg></div>'}
function bead(){let colors=['#eabf36','#25222d','#d94655','#ffffff','#58b77c'];let d=beads[step];return '<div class="scene"><div class="beads">'+colors.map((c,i)=>'<div class="bead '+(i<=step?'on':'')+'" style="background:'+c+'"></div>').join('')+'</div><div class="emoji">'+d[0]+'</div><h2>'+d[1]+'</h2><p>'+d[2]+'</p><div class="verse">📖 '+d[3]+'</div></div>'}
function render(){let max=tool==='circles'&&mode==='board'?shapes.length:data().length;$('stage').innerHTML=tool==='circles'&&mode==='board'?board():tool==='beads'?bead():card();$('progress').textContent='第 '+(step+1)+' / '+max+' 步';$('fill').style.width=((step+1)/max*100)+'%';$('prev').disabled=step===0;$('prev').style.opacity=step===0?'.45':'1';$('next').textContent=step===max-1?'完成 ✓':tool==='circles'&&mode==='board'?'畫出下一步 →':'下一步 →';document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('modes').style.display=tool==='circles'?'flex':'none'}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;step=0;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;step=0;render()});$('prev').onclick=()=>{step=Math.max(0,step-1);render()};$('next').onclick=()=>{step=Math.min((tool==='circles'&&mode==='board'?shapes.length:data().length)-1,step+1);render()};$('reset').onclick=()=>{step=0;render()};$('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert('已複製網站連結')}else prompt('複製網站連結',location.href)}catch(e){}};render();
</script></body></html>
